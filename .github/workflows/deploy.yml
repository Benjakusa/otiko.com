name: Deploy to Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Run Backend Tests
        run: |
          cd backend
          pip install -r requirements.txt
          pytest tests/ --cov=app
      
      - name: Run Frontend Tests
        run: |
          cd frontend-public
          npm ci
          npm run test
          npm run lint
      
      - name: Security Scan
        run: |
          cd backend
          pip-audit
          cd ../frontend-public
          npm audit
          
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Build Backend Docker Image (SHA-tagged)
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker build -t gcr.io/otiko-production/backend:$SHA ./backend
          docker tag gcr.io/otiko-production/backend:$SHA gcr.io/otiko-production/backend:latest
          docker push gcr.io/otiko-production/backend:$SHA
          docker push gcr.io/otiko-production/backend:latest
      
      - name: Run Database Migrations (alembic upgrade head)
        run: |
          docker run --rm gcr.io/otiko-production/backend:latest alembic upgrade head
      
      - name: Deploy Backend to Cloud Run (SHA-tagged)
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          gcloud run deploy otiko-backend \
            --image gcr.io/otiko-production/backend:$SHA \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 2 \
            --concurrency 80 \
            --max-instances 100
      
      - name: Deploy Celery Workers
        run: |
          gcloud run jobs deploy otiko-worker \
            --image gcr.io/otiko-production/worker:latest \
            --tasks 5 \
            --max-retries 3
      
      - name: Deploy Public Frontend to Firebase
        run: |
          cd frontend-public
          npm run build
          firebase deploy --only hosting:otiko-public
      
      - name: Deploy Admin Frontend to Firebase
        run: |
          cd frontend-admin
          npm run build
          firebase deploy --only hosting:otiko-admin

  notify-failure:
    needs: [test, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify on workflow failure
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue?.number || 1,
              body: `## ❌ Workflow Failed\n**Workflow:** ${context.workflow}\n**Branch:** ${context.ref}\n**Commit:** ${context.sha}\n**Run:** ${runUrl}`
            });
